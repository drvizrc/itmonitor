      - name: Build
        env:
          ANDROID_KS: ${{ secrets.ANDROID_KS }}
        run: |
          cd /tmp/proj
          export KS_PASS="${ANDROID_KS%% *}"
          echo "${ANDROID_KS#* }" | base64 -d > /tmp/ks.jks
          export KS_FILE=/tmp/ks.jks
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/RheumaCARE_IT.apk
      - name: Publish
        run: |
          git config user.name "RheumaCARE build"
          git config user.email "build@users.noreply.github.com"
          git add RheumaCARE_IT.apk
          git commit -m "Android app build" || exit 0
          git push
